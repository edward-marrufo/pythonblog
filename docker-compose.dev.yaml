#/basicblog/docker-compose.dev.yaml
services:
  postgres:
    image: postgres:17.9-trixie
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: api
    command: uvicorn backend.app.main:app --host 0.0.0.0 --reload
    ports:
      - "8000:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
    # Mount your local app folder for live code changes
    volumes:
      - ./backend:/app/backend:Z
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    #tty: false
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/app:/app:Z
    stop_grace_period: 10s
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  api_data: